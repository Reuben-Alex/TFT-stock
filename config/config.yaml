# TFT Stock Prediction System Configuration

# Data Configuration
data:
  # Yahoo Finance settings
  yahoo:
    period: "5y"  # 5 years of historical data
    interval: "1d"  # Daily data
    threads: 10  # Parallel download threads
    
  # Stock lists and markets
  markets:
    nse_url: "https://www1.nseindia.com/content/equities/EQUITY_L.csv"
    bse_url: "https://www.bseindia.com/corporates/List_Scrips.aspx"
    indices: 
      - "^NSEI"  # Nifty 50
      - "^BSESN"  # Sensex
      - "^INDIAVIX"  # India VIX
  
  # Database settings
  database:
    path: "data/stocks.db"
    backup_frequency: 7  # days
    
  # Data quality thresholds
  quality:
    min_trading_days: 252  # Minimum 1 year of data
    max_missing_pct: 0.05  # Maximum 5% missing data
    outlier_threshold: 5.0  # Standard deviations for outlier detection

# Feature Engineering Configuration
features:
  # Technical indicators parameters
  technical:
    sma_periods: [5, 10, 20, 50, 200]
    ema_periods: [12, 26]
    rsi_period: 14
    macd_params: [12, 26, 9]
    bollinger_period: 20
    bollinger_std: 2
    
  # Market features
  market:
    sector_correlation_window: 252
    beta_calculation_window: 252
    relative_strength_periods: [10, 20, 50]
    
  # Temporal features
  temporal:
    include_day_of_week: true
    include_month: true
    include_quarter: true
    earnings_season_months: [1, 4, 7, 10]  # Quarterly earnings months

# TFT Model Configuration
model:
  # Architecture parameters - Lightweight for M2
  tft:
    hidden_size: 32
    lstm_layers: 1
    attention_heads: 2
    dropout: 0.2
    
    # Input configuration
    static_features: 10  # Sector, market cap quintile, etc.
    dynamic_features: 29  # Technical indicators, price/volume (actual count)
    lookback_window: 30  # 60 days of historical data
    
    # Output configuration
    prediction_horizons: [1, 5, 22]  # 1 day, 1 week, 1 month
    quantiles: [0.1, 0.5, 0.9]  # Prediction intervals
    
  # Multi-task learning
  tasks:
    daily_price: 
      weight: 1.0
      loss: "mse"
    weekly_price:
      weight: 0.8
      loss: "mse"
    monthly_price:
      weight: 0.6
      loss: "mse"
    ranking_score:
      weight: 0.5
      loss: "ranking"

# Training Configuration
training:
  # General parameters - Fast training
  batch_size: 128
  max_epochs: 20
  learning_rate: 0.001
  weight_decay: 1e-5
  
  # Validation strategy
  validation:
    strategy: "walk_forward"
    initial_train_years: 3
    validation_months: 3
    test_months: 1
    
  # Early stopping
  early_stopping:
    patience: 10
    min_delta: 0.001
    monitor: "val_loss"
    
  # Learning rate scheduling
  scheduler:
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 5
    min_lr: 1e-6

# Prediction Configuration
prediction:
  # Daily signals
  signals:
    buy_threshold: 0.02  # 2% expected return
    sell_threshold: -0.02  # -2% expected loss
    confidence_threshold: 0.7
    
  # Weekly/Monthly forecasts
  forecasting:
    top_picks: 20
    sector_diversification: true
    min_volume: 100000  # Minimum daily volume
    
  # Portfolio optimization
  portfolio:
    max_positions: 20
    max_sector_weight: 0.3
    risk_free_rate: 0.06  # 6% annual risk-free rate
    target_volatility: 0.15  # 15% annual volatility

# Interface Configuration
interface:
  gradio:
    port: 7860
    share: false
    debug: true
    
  # Dashboard settings
  dashboard:
    refresh_interval: 300  # 5 minutes
    max_stocks_display: 50
    default_charts: ["price", "volume", "rsi", "macd"]
    
# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/stock_predictor.log"
  max_file_size: "10MB"
  backup_count: 5
